server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend — Network Alias 'invex'
    # FORCE IPv4 to avoid "Connection Refused" on IPv6
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_host "invex";
    
    location /api/ {
        # Using variable forces dynamic resolution via our ipv6=off resolver
        # Must use $request_uri to preserve the path when using variables
        proxy_pass http://$backend_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host invex;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # React Router — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
