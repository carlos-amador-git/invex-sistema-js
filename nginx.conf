server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend — internal Docker network
    # Use variable + resolver to prevent Nginx crash if backend is not ready/resolvable at startup
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream "http://fk4gggcwwgw4sk4sg04gg08s:8000";

    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host fk4gggcwwgw4sk4sg04gg08s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # React Router — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
